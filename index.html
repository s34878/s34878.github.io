<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของพิมพ์ลภัส</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: sans-serif;
            color: #2c3e50;

            /* พื้นหลังแบบวิศวะ + น่ารัก */
            background-color: #eef6ff;
            background-image:
                linear-gradient(rgba(52, 152, 219, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 152, 219, 0.08) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.15);

            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* แถบด้านบน */
        .card-header {
            height: 100px;

            background: linear-gradient(
                135deg,
                #dff1ff 0%,
                #c9e7ff 60%,
                #f8d9e8 100%
            );

            border-radius: 15px;
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        .card-header::before {
            content: "⚙️";
        }

        h1 {
            color: #2c3e50;
            font-size: 22px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        h1 span {
            color: #3498db;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
            color: #5d7184;
        }

        strong {
            color: #3498db;
        }

        .btn {
            display: block;
            background: #2c3e50;
            color: white;

            padding: 14px;
            text-decoration: none;
            border-radius: 30px;

            margin-top: 25px;
            font-weight: bold;

            transition: 0.2s;
        }

        .btn:hover {
            background: #3498db;
            transform: translateY(-2px);
        }

        .small-text {
            margin-top: 18px;
            font-size: 13px;
            color: #8a9aaa;
        }

        .heart {
            color: #e88bb7;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="card-header"></div>

        <h1>
            ยินดีต้อนรับสู่โปรไฟล์ของ<br>
            <span>พิมพ์ลภัส (Pimrapat)</span> 💗
        </h1>

        <p>
            ขณะนี้กำลังศึกษาและสนใจด้าน
            <strong>วิศวกรรมศาสตร์</strong> ⚙️
        </p>

        <p>
            นี่คือเว็บไซต์แรกของดิฉัน
            ที่โฮสต์บน GitHub Pages
        </p>

        <a href="portfolio.html" class="btn">
            📁 ดูแฟ้มสะสมงานทางวิศวกรรม
        </a>

        <div class="small-text">
            Engineering × Creativity <span class="heart">♥</span>
        </div>

    </div>

</body>
</html>
