<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของพิมพ์ลภัส</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: sans-serif;
            color: #2c3e50;
            overflow: hidden;

            background-color: #eef6ff;
            background-image:
                linear-gradient(rgba(52, 152, 219, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 152, 219, 0.08) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* ของตกแต่งลอย */
        .floating {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        .gear {
            font-size: 55px;
            animation: spin 8s linear infinite;
            opacity: 0.65;
        }

        .gear1 {
            top: 10%;
            left: 10%;
        }

        .gear2 {
            bottom: 12%;
            right: 10%;
            font-size: 40px;
            animation-direction: reverse;
        }

        .sparkle {
            font-size: 25px;
            animation: sparkle 1.8s ease-in-out infinite;
        }

        .sparkle1 {
            top: 18%;
            right: 18%;
        }

        .sparkle2 {
            bottom: 20%;
            left: 15%;
            animation-delay: 0.8s;
        }

        .heart {
            font-size: 25px;
            color: #e88bb7;
            animation: floatHeart 3s ease-in-out infinite;
        }

        .heart1 {
            top: 30%;
            left: 7%;
        }

        .heart2 {
            bottom: 28%;
            right: 7%;
            animation-delay: 1s;
        }

        /* การ์ดหลัก */
        .card {
            position: relative;
            z-index: 2;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(44, 62, 80, 0.18);

            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;

            animation: cardFloat 4s ease-in-out infinite;
        }

        /* แถบด้านบน */
        .card-header {
            height: 110px;
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #dff1ff,
                #c9e7ff,
                #f8d9e8
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            box-shadow: inset 0 0 20px rgba(255,255,255,0.7);
        }

        .card-header::before {
            content: "⚙️";
            animation: spin 6s linear infinite;
        }

        h1 {
            color: #2c3e50;
            font-size: 22px;
            line-height: 1.5;
            margin: 22px 0 15px;
        }

        h1 span {
            color: #3498db;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
            color: #5d7184;
        }

        strong {
            color: #3498db;
        }

        /* ปุ่ม */
        .btn {
            display: block;
            background: #2c3e50;
            color: white;

            padding: 14px;
            text-decoration: none;
            border-radius: 30px;

            margin-top: 25px;
            font-weight: bold;

            box-shadow: 0 5px 0 #1d2a36;

            transition: 0.2s;
        }

        .btn:hover {
            background: #3498db;
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #217dbb;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #217dbb;
        }

        .small-text {
            margin-top: 18px;
            font-size: 13px;
            color: #8a9aaa;
        }

        .pink-heart {
            color: #e88bb7;
        }

        /* Animation */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(0.7) rotate(0deg);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.3) rotate(20deg);
                opacity: 1;
            }
        }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0) rotate(-8deg);
            }

            50% {
                transform: translateY(-18px) rotate(8deg);
            }
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* มือถือ */
        @media (max-width: 500px) {
            .gear {
                font-size: 40px;
            }

            .heart {
                font-size: 20px;
            }

            .sparkle {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ของตกแต่งลอย ๆ -->
    <div class="floating gear gear1">⚙️</div>
    <div class="floating gear gear2">⚙️</div>

    <div class="floating sparkle sparkle1">✨</div>
    <div class="floating sparkle sparkle2">⭐</div>

    <div class="floating heart heart1">♡</div>
    <div class="floating heart heart2">💗</div>


    <div class="card">

        <div class="card-header"></div>

        <h1>
            ยินดีต้อนรับสู่โปรไฟล์ของ<br>
            <span>พิมพ์ลภัส (Pimrapat)</span> 💗
        </h1>

        <p>
            ขณะนี้กำลังศึกษาและสนใจด้าน
            <strong>วิศวกรรมศาสตร์</strong> ⚙️
        </p>

        <p>
            นี่คือเว็บไซต์แรกของดิฉัน
            ที่โฮสต์บน GitHub Pages
        </p>

        <a href="portfolio.html" class="btn">
            📁 ดูแฟ้มสะสมงานทางวิศวกรรม
        </a>

        <div class="small-text">
            Engineering × Creativity
            <span class="pink-heart">♥</span>
        </div>

    </div>

</body>
</html>
